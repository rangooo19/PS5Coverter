name: Build exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install customtkinter tkinterdnd2 pyinstaller

      - name: Build exe
        run: pyinstaller --noconsole --onefile --name PS5Converter --collect-all customtkinter --collect-all tkinterdnd2 ps5_converter.py

      - name: Add ffmpeg (with NVENC/AMF)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName dist\

      - uses: actions/upload-artifact@v4
        with:
          name: PS5Converter
          path: dist/*
